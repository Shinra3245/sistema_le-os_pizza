<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vista previa · Animación de carga de pizza</title>
  <style>
    :root { color-scheme: light; --ink:#2d302b; --forest:#345f4f; --cream:#f4f1e8; --line:#e3ded2; --gold:#a77a2f; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:28px; background:#f3f2ed; color:var(--ink); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(920px,100%); padding:28px; border:1px solid var(--line); border-radius:18px; background:#fffdfa; box-shadow:0 18px 55px rgba(55,48,34,.08); }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .eyebrow { display:block; margin-bottom:7px; color:#927441; font-size:11px; font-weight:800; letter-spacing:1.5px; }
    h1 { margin:0; font:700 clamp(28px,4vw,42px)/1.05 Georgia,serif; }
    p { max-width:590px; margin:9px 0 0; color:#7d7f76; font-size:13px; line-height:1.55; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:0 14px; border:1px solid #d9d5ca; border-radius:8px; color:var(--forest); font-size:11px; font-weight:750; text-decoration:none; }
    a.primary { border-color:var(--forest); background:var(--forest); color:white; }
    .stage { display:grid; place-items:center; min-height:560px; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:radial-gradient(circle at 50% 45%,#fff 0 42%,#f7f3e9 100%); }
    .stage img { display:block; width:min(540px,84vw); height:auto; }
    footer { display:flex; justify-content:space-between; gap:14px; margin-top:14px; color:#929188; font-size:10px; }
    code { color:#6e654f; }
    @media (max-width:680px) { body{padding:12px} main{padding:17px} header{align-items:flex-start;flex-direction:column}.stage{min-height:390px}.actions{width:100%}.actions a{flex:1}footer{flex-direction:column} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><span class="eyebrow">ANIMACIÓN DE CARGA · PORCIONES</span><h1>Pizza vectorial</h1><p>La pizza oculta cada rebanada en sentido horario y después la reconstruye en el mismo orden.</p></div>
      <nav class="actions" aria-label="Acciones del recurso">
        <a href="/assets/pizza-loader-vector.svg" target="_blank" rel="noreferrer">Abrir SVG</a>
        <a class="primary" href="/assets/pizza-loader-vector.svg" download>Descargar</a>
      </nav>
    </header>
    <section class="stage" aria-label="Vista previa del icono">
      <img src="/assets/pizza-loader-vector.svg" alt="Pizza vectorial completa dividida en ocho porciones" />
    </section>
    <footer><span>Formato SVG · fondo transparente · escalable</span><code>/assets/pizza-loader-vector.svg</code></footer>
  </main>
</body>
</html>
